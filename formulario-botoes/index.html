<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> formulário de inscrição de workshop</title>
</head>
<body>
    <main> 
        <section id="inscricao"> 
            <h2> ficha de inscrição no workshop</h2>
            <p> preencha os dados abaixo:</p>

            <from action ="#" method="POST">
<fieldset>
    <label for="campo-nome">Nome completo:</label></br>
    <input type="text" nome="Nome completo" id="campo-nome" placeholder="informe seu nome" required size="40"><br>
    <label for="campo-email"> email pessoal:</label><br>
    <input type="email" nome="email-pessoal" id="campo-email"placeholder="informe seu email" required size="40"><br>
    <label for="campo-telefone">telefone pessoal:</label><br>
    <input type="tel" nome="telefone-pessoal" id="campo-telefone" placeholder="informe seu telefone" required size="40"><br>
    <label for="campo-data_nacimento">Data de nascimeno :</label><br>
    

</fieldset>
            </from>
        </section>
    </main>
    
</body>
</html>
